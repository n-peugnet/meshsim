[project]
dynamic = ["version"]
name = "meshsim"
description = "Simulates a mesh network with Docker."
readme = "README.md"
requires-python = ">=3.6"
# license = "GPL-3.0-or-later"
dependencies = [
  "aiohttp~=3.10",
  "async-timeout~=3.0",
  "Hypercorn~=0.17",
  "networkx~=3.2.0",
  "numpy~=2.1",
  "quart~=0.16",
  "tqdm~=4.67",
]

[project.scripts]
meshsim = "meshsim.meshsim:main"

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.targets.wheel]
include = [
  "/*.py",
  "/*.sh",
  "/index.html",
  "/static",
]

[tool.hatch.build.targets.wheel.sources]
"" = "meshsim"

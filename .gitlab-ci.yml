test:
  tags:
    - yolo
  image: golang
  stage: test
  before_script:
    - cd topologiser
  script:
    - apt update
    - apt install -y iproute2
    - go build -v
    - make test
    - go vet ./...
    - go fmt ./... && git diff --exit-code --color
  coverage: '/coverage: \d+\.\d+?%/'

deploy:
  image: docker:latest
  stage: deploy
  services:
    - docker:dind
  variables:
    PLATFORMS: linux/arm/v7,linux/arm64/v8,linux/amd64
  rules:
    - if: $CI_COMMIT_BRANCH != "master"
      when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker buildx create --name buildx-builder --use
    - docker buildx build --push -f topologiser/CI.Dockerfile --platform $PLATFORMS --tag $CI_REGISTRY_IMAGE/topologiser:latest topologiser
    - docker buildx build --push --platform $PLATFORMS --tag $CI_REGISTRY_IMAGE:latest .

image: golang

test:
  stage: test
  before_script:
    - cd topologiser
  script:
    - go build -v
    - go test -v -coverprofile=c.out ./...
    - |
      cat c.out |
      awk 'BEGIN {cov=0; stat=0;}
           $3!="" { cov+=($3==1?$2:0); stat+=$2; }
           END {printf("total coverage: %.2f%% of statements\n", (cov/stat)*100);}'
    - go vet ./...
    - go fmt ./... && git diff --exit-code --color
  coverage: '/total coverage: \d+\.\d+?%/'

deploy:
  image: docker:latest
  stage: deploy
  services:
    - docker:dind
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    IMAGE_PLATFORMS: linux/arm64/v8,linux/amd64
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker buildx create --name buildx-builder --use
    - docker buildx build --push -f CIdockerfile --platform $IMAGE_PLATFORMS --tag $IMAGE_TAG .
